[project]
name = "hermant"
version = "0.1.0"
description = "CSV Data Processor with Groq API for feature extraction and bullet point generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=0.33.0",
    "pandas>=2.0.0",
    "aiofiles>=23.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
    "openpyxl>=3.1.0",
    "fastapi>=0.121.2",
    "uvicorn>=0.38.0",
    "python-multipart>=0.0.20",
    "jinja2>=3.1.6",
]
